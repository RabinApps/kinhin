      - name: Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Flutter packages and iOS config
        working-directory: __APP__
        run: |
          flutter pub get
          flutter build ios --config-only --release
