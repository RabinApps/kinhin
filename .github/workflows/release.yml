name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A release built and uploaded locally (scripts/release.sh, then
  # `gh release create`, see docs/releasing.md) must not be rebuilt and
  # overwritten here: skip the build when the tag already has a release.
  existing:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; not rebuilding it"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: existing
    # Belt and braces: the push trigger is already tag-filtered, so this only
    # matters if another trigger is added later — skip instead of releasing.
    if: startsWith(github.ref, 'refs/tags/v') && needs.existing.outputs.published != 'true'
    runs-on: kinhin-xcode
    # Protected environment: configure required reviewers (and move the signing
    # secrets into it) in the repo settings so a pushed tag alone cannot reach them.
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check toolchain
        # `swift test` needs XCTest, which ships with full Xcode (not the
        # Command Line Tools). Fail here with a pointer instead of minutes
        # into the build; see CONTRIBUTING.md "Requirements".
        run: |
          echo "xcode-select: $(xcode-select -p 2>&1)"
          swift --version
          if ! find "$(xcode-select -p)" -maxdepth 6 -name 'XCTest.framework' 2>/dev/null | grep -q .; then
            echo "::error::XCTest not found under $(xcode-select -p). Use a runner image with full Xcode (for example ghcr.io/cirruslabs/macos-tahoe-xcode:latest), not a Command Line Tools-only image."
            exit 1
          fi

      - name: Run tests
        # Never publish from a red tree: CI should have caught this already,
        # but the tag may point at a commit older than the last green run.
        run: swift test --build-system swiftbuild --parallel

      - name: Derive version from tag
        id: ver
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Git ref names may contain shell metacharacters; only a plain semver
          # ever reaches the later steps.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta-[0-9]+)?$ ]] || { echo "::error::tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-beta-N]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Release builds must be Developer ID signed and notarized; never fall
      # back to ad-hoc for a tag.
      - name: Require signing secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          KINHIN_SPARKLE_PUBLIC_KEY: ${{ vars.KINHIN_SPARKLE_PUBLIC_KEY }}
        run: |
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY NOTARY_API_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID SPARKLE_ED_PRIVATE_KEY KINHIN_SPARKLE_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::missing repository secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # The runner context is not available in job-level env, so resolve
          # the temp paths here and export them for the later steps.
          KEYCHAIN_PATH="$RUNNER_TEMP/kinhin-signing.keychain-db"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
          } >> "$GITHUB_ENV"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "$NOTARY_API_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          {
            echo "CODESIGN_IDENTITY=$MACOS_SIGN_IDENTITY"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # Version.swift is the single source: stamp it from the tag so the CLI,
      # the app and the bundle metadata all report the released version.
      - name: Stamp version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          sed -i '' "s/current = \".*\"/current = \"$VERSION\"/" Sources/KinhinKit/Core/Version.swift
          grep 'current = ' Sources/KinhinKit/Core/Version.swift

      - name: Build, sign and notarize DMG
        timeout-minutes: 40
        env:
          KINHIN_VERSION: ${{ steps.ver.outputs.version }}
          KINHIN_SPARKLE_PUBLIC_KEY: ${{ vars.KINHIN_SPARKLE_PUBLIC_KEY }}
        run: ./scripts/make-dmg.sh

      # generate_appcast (Sparkle's tool) signs the update for scripts/appcast.sh. Pinned to one release and
      # its SHA-256, so the signing step never runs an unverified binary.
      - name: Install Sparkle tools
        env:
          SPARKLE_VERSION: "2.10.0"
          SPARKLE_SHA256: "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"
        run: |
          archive="$RUNNER_TEMP/sparkle.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle"
          echo "SPARKLE_TOOLS=$RUNNER_TEMP/sparkle" >> "$GITHUB_ENV"

      # CLI zip, Gatekeeper verification, the Team-ID-stamped installer and
      # checksums live in scripts/release-artifacts.sh: a local
      # `scripts/release.sh` run executes the same code, so a checkout release
      # and a tag publish cannot drift apart.
      - name: Release artifacts (CLI zip, verify, installer, checksums)
        timeout-minutes: 40
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./scripts/release-artifacts.sh "$VERSION"

      # The notes are the version's CHANGELOG section, as in a local publish.
      - name: Release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v h="## v$VERSION" '$0 == h {f=1; next} /^## /{f=0} f' CHANGELOG.md > dist/release-notes.md
          [ -s dist/release-notes.md ] || { echo "::error::CHANGELOG.md has no '## v$VERSION' section"; exit 1; }

      # Not a prerelease, even for -beta-N: GitHub's releases/latest, which the
      # install URL and install.sh resolve, never returns a prerelease. Revisit
      # once a stable line exists.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/kinhin-*.dmg
            dist/kinhin-cli-*.zip
            dist/install.sh
            dist/checksums.txt
            dist/appcast.xml
          body_path: dist/release-notes.md
          prerelease: false
          make_latest: true

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$NOTARY_KEY_PATH" "$RUNNER_TEMP/cert.p12"
