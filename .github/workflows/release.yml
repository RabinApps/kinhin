name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Belt and braces: the push trigger is already tag-filtered, so this only
    # matters if another trigger is added later — skip instead of releasing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Release builds must be Developer ID signed and notarized; never fall
      # back to ad-hoc for a tag.
      - name: Require signing secrets
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD MACOS_SIGN_IDENTITY NOTARY_API_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::missing repository secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # The runner context is not available in job-level env, so resolve
          # the temp paths here and export them for the later steps.
          KEYCHAIN_PATH="$RUNNER_TEMP/kinhin-signing.keychain-db"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH"
          } >> "$GITHUB_ENV"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "$NOTARY_API_KEY_P8" | base64 --decode > "$NOTARY_KEY_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          {
            echo "CODESIGN_IDENTITY=$MACOS_SIGN_IDENTITY"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # Version.swift is the single source: stamp it from the tag so the CLI,
      # the app and the bundle metadata all report the released version.
      - name: Stamp version
        run: |
          sed -i '' "s/current = \".*\"/current = \"${{ steps.ver.outputs.version }}\"/" Sources/KinhinKit/Core/Version.swift
          grep 'current = ' Sources/KinhinKit/Core/Version.swift

      - name: Build, sign and notarize DMG
        timeout-minutes: 40
        env:
          KINHIN_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Sign and notarize CLI zip
        timeout-minutes: 30
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BIN_DIR="$(swift build -c release --show-bin-path --product kinhin)"
          mkdir -p dist/cli
          cp "$BIN_DIR/kinhin" dist/cli/
          codesign --force --sign "$CODESIGN_IDENTITY" --options runtime --timestamp dist/cli/kinhin
          codesign --verify --strict --verbose=2 dist/cli/kinhin
          (cd dist/cli && zip ../kinhin-cli-$VERSION-arm64.zip kinhin)
          ./scripts/notarize.sh "dist/kinhin-cli-$VERSION-arm64.zip"

      - name: Verify Gatekeeper acceptance
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DMG="dist/kinhin-$VERSION-arm64.dmg"
          xcrun stapler validate "$DMG"
          spctl -a -vv -t open --context context:primary-signature "$DMG"
          MOUNT="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -quiet
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$MOUNT/kinhin.app"
          reported="$("$MOUNT/kinhin.app/Contents/Resources/bin/kinhin" version)"
          [ "$reported" = "kinhin $VERSION" ] || { echo "::error::CLI reports '$reported', expected 'kinhin $VERSION'"; exit 1; }
          spctl -a -vv -t exec "$MOUNT/kinhin.app"

      - name: Stage installer
        run: cp scripts/install.sh dist/install.sh

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 kinhin-*.dmg kinhin-cli-*.zip install.sh > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kinhin-*.dmg
            dist/kinhin-cli-*.zip
            dist/install.sh
            dist/checksums.txt
          generate_release_notes: true

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$NOTARY_KEY_PATH" "$RUNNER_TEMP/cert.p12"
