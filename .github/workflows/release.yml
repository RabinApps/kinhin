name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          KINHIN_VERSION: ${{ steps.ver.outputs.version }}
        run: ./scripts/make-dmg.sh

      - name: Zip CLI
        run: |
          BIN_DIR="$(swift build -c release --show-bin-path --product kinhin)"
          mkdir -p dist/cli
          cp "$BIN_DIR/kinhin" dist/cli/
          cd dist/cli && zip ../kinhin-cli-${{ steps.ver.outputs.version }}-arm64.zip kinhin

      - name: Stage installer
        run: cp scripts/install.sh dist/install.sh

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 kinhin-*.dmg kinhin-cli-*.zip install.sh > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kinhin-*.dmg
            dist/kinhin-cli-*.zip
            dist/install.sh
            dist/checksums.txt
          generate_release_notes: true
