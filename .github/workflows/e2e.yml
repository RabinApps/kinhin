name: E2E

# The end-to-end suite (Tests/E2E, docs/e2e-testing.md) stands up real forges in containers and runs real jobs
# through real guests. It cannot run on `kinhin-xcode` (that runner is itself a Tart VM, which cannot nest further
# VMs) or on GitHub-hosted runners (no Docker-for-Mac, no Tart, no Apple container). It needs a dedicated Apple
# Silicon Mac registered with the label `kinhin-e2e`, with Docker (or Colima/OrbStack), the `container` CLI and
# Tart installed. Never triggered by pull requests: it executes the checked-out code against real containers.

on:
  # The schedule waits for the dedicated `kinhin-e2e` Mac (beta-2, docs/beta-roadmap.md): with no such runner every
  # scheduled run only queues. Restore these when it is registered:
  #   - cron: "0 9 * * *" # nightly: the local tier
  #   - cron: "0 10 * * 0" # weekly: everything: GitLab CE, the Tart and host lanes, the whole toolchain catalog
  workflow_dispatch:
    inputs:
      tier:
        description: "quick | local | full"
        default: local
        required: true

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: [self-hosted, kinhin-e2e]
    timeout-minutes: 600
    env:
      # Optional lanes: set these repository secrets to turn the GitHub lane on (use a throwaway repository).
      KINHIN_E2E_GITHUB_TOKEN: ${{ secrets.KINHIN_E2E_GITHUB_TOKEN }}
      KINHIN_E2E_GITHUB_REPO: ${{ secrets.KINHIN_E2E_GITHUB_REPO }}
      # The Buildkite lane: a throwaway organization, scope `org/cluster`, with a `kinhin` queue in the cluster.
      KINHIN_E2E_BUILDKITE_TOKEN: ${{ secrets.KINHIN_E2E_BUILDKITE_TOKEN }}
      KINHIN_E2E_BUILDKITE_SCOPE: ${{ secrets.KINHIN_E2E_BUILDKITE_SCOPE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the tier
        id: tier
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tier=${{ inputs.tier }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 10 * * 0" ]; then
            echo "tier=full" >> "$GITHUB_OUTPUT"
          else
            echo "tier=local" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the machine
        run: |
          docker info --format 'docker {{.ServerVersion}}'
          container system status || true
          tart --version
          df -h /System/Volumes/Data | tail -1

      - name: Run the suite
        run: scripts/e2e.sh --${{ steps.tier.outputs.tier }}

      - name: Sweep leftovers
        # Teardown is part of every test, but a hard-killed run can still leave daemons, host agents, forge
        # containers, baked images and sandboxes behind.
        if: always()
        run: scripts/e2e-sweep.sh --force
