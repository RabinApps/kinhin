name: Docs

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**"]
  # A release (tag push) deploys the site after it is published, so the signed
  # appcast the release made is on the site. Deploying on the tag push itself
  # would race the release and replace the site without it.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

# One-time manual step (required before the first deploy):
#   Repo Settings → Pages → Build and deployment → Source = "GitHub Actions"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # kinhin's own Apple-container pool (`kinhin-container` is its exclusive
    # marker). This workflow triggers on push, a finished Release, or dispatch — PRs never run it — so
    # no fork guard is needed; the Pages deploy job stays on ubuntu-latest.
    runs-on: kinhin-container
    steps:
      - name: Check toolchain
        # fetch-depth: 0, the per-tag worktrees and the jq loop below need git
        # and jq baked into the image (Node comes from setup-node below). Fail
        # with the fix instead of "command not found" after a long build.
        run: |
          git --version || { echo "::error::git is missing in the container image — re-bake: kinhin image prepare --container"; exit 1; }
          jq --version || { echo "::error::jq is missing in the container image — re-bake: kinhin image prepare --container"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release tags are built into per-version snapshots below

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck config
        working-directory: website
        run: npm run typecheck

      - name: Build site
        working-directory: website
        run: npm run build

      # Each version listed in website/versions.json is built from its own tag (its own docs/ and
      # website/), then served under /<tag>/ next to the latest docs at /. website/snapshot.config.ts
      # wraps the tag's config: repository links point at the tag, and a dead link frozen in an old
      # release does not fail the deploy. The tag itself is never modified.
      - name: Build version snapshots
        run: |
          for v in $(jq -r '.[]' website/versions.json); do
            git worktree add "$RUNNER_TEMP/docs-$v" "refs/tags/$v"
            snap="$RUNNER_TEMP/docs-$v/website/.vitepress"
            mv "$snap/config.ts" "$snap/config.base.ts"
            cp website/snapshot.config.ts "$snap/config.ts"
            versions="$(jq -c . website/versions.json)"
            (cd "$RUNNER_TEMP/docs-$v/website" && npm ci && DOCS_VERSION="$v" DOCS_VERSIONS="$versions" npm run build)
            mkdir -p "website/.vitepress/dist/$v"
            cp -R "$RUNNER_TEMP/docs-$v/website/.vitepress/dist/." "website/.vitepress/dist/$v/"
          done

      # The updater's feed (SUFeedURL points at https://kinhin.dev/appcast.xml). The release workflow signs it
      # into the latest release, so every site build copies that copy in. Before the first signed release there
      # is none, and the site simply goes out without one.
      - name: Fetch the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=website/.vitepress/dist/appcast.xml
          # A failed query is not "no appcast": deploying then would drop the live feed on a transient API error.
          # The kinhin-container image has no gh, so query the REST API with curl.
          if ! release=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/RabinApps/kinhin/releases/latest); then
            echo "::error::could not query the latest release's assets; not deploying without the feed"
            exit 1
          elif ! grep -Eq '"name": *"appcast.xml"' <<<"$release"; then
            echo "::warning::no appcast.xml on the latest release; the site is deployed without one"
          elif curl -fsSL --retry 3 -o "$out" "https://github.com/RabinApps/kinhin/releases/latest/download/appcast.xml"; then
            echo "appcast: $(grep -o 'sparkle:version>[^<]*' "$out" | head -n 1)"
          else
            echo "::error::the latest release has appcast.xml but it could not be fetched; not deploying without the feed"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: kinhin-container
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
