name: Docs

on:
  push:
    branches: [main, develop]
    paths: ["website/**", "docs/**"]
  # Pull requests build and smoke-test the site but never deploy it.
  pull_request:
    paths: ["website/**", "docs/**", ".github/workflows/docs.yml"]
  # A release (tag push) deploys the site after it is published, so the signed
  # appcast the release made is on the site. Deploying on the tag push itself
  # would race the release and replace the site without it.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy the site
        type: choice
        options: [dev, production]
        default: dev

# The site is a Next.js app served by a Cloudflare Worker (OpenNext). One-time setup, outside this repo:
#   * Repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit; Workers Routes: Edit; Zone: Read and DNS: Edit) and CLOUDFLARE_ACCOUNT_ID
#   * The kinhin.dev zone on Cloudflare; the Worker takes the custom domain on its first deploy (website/wrangler.jsonc)
#   * Dev (dev.kinhin.dev, deployed from `develop`) is behind Cloudflare Access: run website/scripts/cloudflare-access.mjs once, then store
#     the variables DEV_ACCESS_TEAM_DOMAIN and DEV_ACCESS_AUD and the secrets CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET
#     (a service token, used only for the post-deploy check). See "Dev environment" in CONTRIBUTING.md.
permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || format('deploy-{0}', (github.ref_name == 'develop' || (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')) && 'dev' || 'production') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Deploys run on kinhin's own Apple-container pool (`kinhin-container` is its exclusive marker). Pull requests
    # build on a GitHub-hosted runner instead, so no PR code ever reaches that pool or the Cloudflare secrets.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'kinhin-container' }}
    steps:
      - name: Check toolchain
        # The per-tag worktrees need git (Node comes from setup-node below). Fail with the fix instead of
        # "command not found" after a long build.
        run: |
          git --version || { echo "::error::git is missing in the container image; re-bake it with kinhin image prepare --container"; exit 1; }

      # Where this run deploys: `develop` pushes go to dev.kinhin.dev, `main`, a finished Release and a manual run of
      # "production" go to kinhin.dev, a manual run defaults to dev, and pull requests deploy nowhere.
      - name: Choose the deploy target
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT: ${{ inputs.target }}
        run: |
          case "$EVENT:$REF" in
            pull_request:*) target=none ;;
            push:develop) target=dev ;;
            workflow_dispatch:*)
              target=${INPUT:-dev}
              # Production is built from main only: a manual run from any other branch may deploy to dev, never to kinhin.dev.
              if [ "$target" = production ] && [ "$REF" != main ]; then
                echo "::error::deploying to production is only allowed from main (this run is on $REF); choose target=dev"
                exit 1
              fi
              ;;
            *) target=production ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "deploy target: $target"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release tags are built into per-version snapshots

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck and unit tests
        working-directory: website
        run: |
          npm run typecheck
          npm test

      # The updater's feed (SUFeedURL points at https://kinhin.dev/appcast.xml). The release workflow signs it
      # into the latest release, so every site build copies that copy in. Before the first signed release there
      # is none, and the site simply goes out without one.
      - name: Fetch the update feed
        if: steps.target.outputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=website/public/appcast.xml
          # A failed query is not "no appcast": deploying then would drop the live feed on a transient API error.
          # The kinhin-container image has no gh, so query the REST API with curl.
          if ! release=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/RabinApps/kinhin/releases/latest); then
            echo "::error::could not query the latest release's assets; not deploying without the feed"
            exit 1
          elif ! grep -Eq '"name": *"appcast.xml"' <<<"$release"; then
            echo "::warning::no appcast.xml on the latest release; the site is deployed without one"
          elif curl -fsSL --retry 3 -o "$out" "https://github.com/RabinApps/kinhin/releases/latest/download/appcast.xml"; then
            echo "appcast: $(grep -o 'sparkle:version>[^<]*' "$out" | head -n 1)"
          else
            echo "::error::the latest release has appcast.xml but it could not be fetched; not deploying without the feed"
            exit 1
          fi

      # Every version in website/versions.json is rendered from its own tag's docs/ and website/ by the current
      # site (a static export under /<tag>/), then the latest docs are built as the Worker. A snapshot that fails
      # to build fails the job (SNAPSHOT_STRICT), so it is caught on the pull request; a listed tag that does not exist yet is
      # skipped with a warning. The tag itself is never modified.
      - name: Build the site
        working-directory: website
        env:
          SNAPSHOT_STRICT: "1"
          GITHUB_TOKEN: ${{ github.token }} # the star count is read at build time; the anonymous API limit is easy to hit on a shared runner
        run: scripts/build-site.sh

      - name: Check the Worker size and the JavaScript budgets
        working-directory: website
        run: |
          scripts/check-worker-size.sh
          node scripts/check-bundle.mjs

      - name: Smoke test the Worker
        working-directory: website
        run: scripts/smoke.sh

      # The browser suite (website/e2e): runs on pull requests, on a GitHub-hosted runner that can install Chromium; the
      # deploy image does not carry one. It serves the same Worker the smoke test just checked.
      - name: Install Chromium for the end-to-end tests
        if: github.event_name == 'pull_request'
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        if: github.event_name == 'pull_request'
        working-directory: website
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            website/playwright-report
            website/.e2e-results
          retention-days: 7

      - name: Deploy to production (kinhin.dev)
        if: steps.target.outputs.target == 'production'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare deploy

      # dev.kinhin.dev: the same build under the `dev` wrangler environment. The Worker refuses requests without a valid
      # Cloudflare Access token (REQUIRE_ACCESS), so it never runs open, even before the Access application exists.
      - name: Deploy to dev (dev.kinhin.dev)
        if: steps.target.outputs.target == 'dev'
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.DEV_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.DEV_ACCESS_AUD }}
        run: |
          [ -n "$ACCESS_TEAM_DOMAIN" ] && [ -n "$ACCESS_AUD" ] || { echo "::error::set the variables DEV_ACCESS_TEAM_DOMAIN and DEV_ACCESS_AUD (node website/scripts/cloudflare-access.mjs prints them)"; exit 1; }
          npx opennextjs-cloudflare deploy --env dev -- --var "ACCESS_TEAM_DOMAIN:$ACCESS_TEAM_DOMAIN" --var "ACCESS_AUD:$ACCESS_AUD"

      # Behind Access an anonymous request must be turned away, and the service token must get the site.
      - name: Check dev is closed to the public and open to CI
        if: steps.target.outputs.target == 'dev'
        env:
          CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          anon=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors https://dev.kinhin.dev/)
          case "$anon" in 302|401|403) echo "anonymous request: $anon (closed)";; *) echo "::error::dev.kinhin.dev answered an anonymous request with $anon"; exit 1;; esac
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::warning::CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET are not set; skipping the authenticated check"
          else
            authed=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 -H "CF-Access-Client-Id: $CLIENT_ID" -H "CF-Access-Client-Secret: $CLIENT_SECRET" https://dev.kinhin.dev/guide/quick-start)
            [ "$authed" = 200 ] || { echo "::error::dev.kinhin.dev answered the service token with $authed"; exit 1; }
            echo "service token: 200"
          fi
