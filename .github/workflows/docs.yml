name: Docs

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**"]
    tags: ["v*"]
  workflow_dispatch:

# One-time manual step (required before the first deploy):
#   Repo Settings → Pages → Build and deployment → Source = "GitHub Actions"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # kinhin's own Apple-container pool (`kinhin-container` is its exclusive
    # marker). This workflow triggers on push/tag only — PRs never run it — so
    # no fork guard is needed; the Pages deploy job stays on ubuntu-latest.
    runs-on: kinhin-container
    steps:
      - name: Check toolchain
        # fetch-depth: 0, the per-tag worktrees and the jq loop below need git
        # and jq baked into the image (Node comes from setup-node below). Fail
        # with the fix instead of "command not found" after a long build.
        run: |
          git --version || { echo "::error::git is missing in the container image — re-bake: kinhin image prepare --container"; exit 1; }
          jq --version || { echo "::error::jq is missing in the container image — re-bake: kinhin image prepare --container"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # release tags are built into per-version snapshots below

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck config
        working-directory: website
        run: npm run typecheck

      - name: Build site
        working-directory: website
        run: npm run build

      # Each version listed in website/versions.json is built from its own tag (its own docs/ and
      # website/), then served under /<tag>/ next to the latest docs at /.
      - name: Build version snapshots
        run: |
          for v in $(jq -r '.[]' website/versions.json); do
            git worktree add "$RUNNER_TEMP/docs-$v" "refs/tags/$v"
            (cd "$RUNNER_TEMP/docs-$v/website" && npm ci && DOCS_VERSION="$v" npm run build)
            mkdir -p "website/.vitepress/dist/$v"
            cp -R "$RUNNER_TEMP/docs-$v/website/.vitepress/dist/." "website/.vitepress/dist/$v/"
          done

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: kinhin-container
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
