name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Lint (swift-format)
        run: swift format lint --strict -r Sources Tests

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docs lint (stale strings + orchard allowlist)
        run: bash scripts/docs-lint.sh
