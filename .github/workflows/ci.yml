name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly: also runs the ThreadSanitizer job
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The self-hosted runner shares a Mac with the fleet and its Keychain, so
    # it never runs code from fork PRs (they would execute arbitrary tests).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prefer mise toolchains
        # The runner's job PATH has Xcode's Swift (6.3.x) ahead of the baked
        # mise-managed one, but Package.swift needs the 6.4 tools. Put the mise
        # shims first; a no-op where mise isn't installed.
        run: |
          shims="$HOME/.local/share/mise/shims"
          [ -d "$shims" ] && echo "$shims" >> "$GITHUB_PATH" || true

      - name: Swift version
        run: swift --version

      - name: Lint (swift-format)
        run: swift format lint --strict -r Sources Tests

      - name: Build
        run: swift build

      - name: Build release products
        # Release-only code paths (KinhinTestSupport is testable-only) and the
        # signed-app pipeline both compile from these; catch breakage here
        # instead of at release time.
        run: swift build -c release --product kinhin-app --product kinhin

      - name: Run tests
        run: swift test

      - name: Docs lint (stale strings)
        run: bash scripts/docs-lint.sh

  tsan:
    # ThreadSanitizer pass over shared state: serial (~5–10 min), so it runs
    # on demand and nightly rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prefer mise toolchains
        # The runner's job PATH has Xcode's Swift (6.3.x) ahead of the baked
        # mise-managed one, but Package.swift needs the 6.4 tools. Put the mise
        # shims first; a no-op where mise isn't installed.
        run: |
          shims="$HOME/.local/share/mise/shims"
          [ -d "$shims" ] && echo "$shims" >> "$GITHUB_PATH" || true

      - name: Tests under ThreadSanitizer (serial)
        # The script exits nonzero on any sanitizer report; a failing exit
        # with "No ThreadSanitizer reports" means a test regression.
        run: scripts/tsan.sh

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Docs lint (stale strings)
        run: bash scripts/docs-lint.sh
