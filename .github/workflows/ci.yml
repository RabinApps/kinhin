name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly: also runs the ThreadSanitizer job
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The self-hosted runner shares a Mac with the fleet and its Keychain, so
    # it never runs code from fork PRs (they would execute arbitrary tests).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macos, arm64, xcode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check toolchain
        # `swift test` needs XCTest, which ships with full Xcode (not the
        # Command Line Tools). Fail here with a pointer instead of minutes
        # into the build; see CONTRIBUTING.md "Requirements".
        run: |
          echo "xcode-select: $(xcode-select -p 2>&1)"
          swift --version
          if ! find "$(xcode-select -p)" -maxdepth 6 -name 'XCTest.framework' 2>/dev/null | grep -q .; then
            echo "::error::XCTest not found under $(xcode-select -p). Use a runner image with full Xcode (for example ghcr.io/cirruslabs/macos-tahoe-xcode:latest), not a Command Line Tools-only image."
            exit 1
          fi

      - name: Swift version
        run: swift --version

      - name: Lint (swift-format)
        run: swift format lint --strict -r Sources Tests

      - name: Build release products
        # Release-only code paths (KinhinTestSupport is testable-only) and the
        # signed-app pipeline both compile from these; catch breakage here
        # instead of at release time.
        run: swift build -c release --product kinhin-app --product kinhin

      - name: Run tests
        run: swift test

      - name: Docs lint (stale strings)
        run: bash scripts/docs-lint.sh

  tsan:
    # ThreadSanitizer pass over shared state: serial (~5–10 min), so it runs
    # on demand and nightly rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos, arm64, xcode]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check toolchain
        # `swift test` needs XCTest, which ships with full Xcode (not the
        # Command Line Tools). Fail here with a pointer instead of minutes
        # into the build; see CONTRIBUTING.md "Requirements".
        run: |
          echo "xcode-select: $(xcode-select -p 2>&1)"
          swift --version
          if ! find "$(xcode-select -p)" -maxdepth 6 -name 'XCTest.framework' 2>/dev/null | grep -q .; then
            echo "::error::XCTest not found under $(xcode-select -p). Use a runner image with full Xcode (for example ghcr.io/cirruslabs/macos-tahoe-xcode:latest), not a Command Line Tools-only image."
            exit 1
          fi

      - name: Tests under ThreadSanitizer (serial)
        # The script exits nonzero on any sanitizer report; a failing exit
        # with "No ThreadSanitizer reports" means a test regression.
        run: scripts/tsan.sh

  docs-lint:
    # Runs in kinhin's own Apple-container pool (`kinhin-container` is that
    # pool's exclusive marker). The fleet Mac must have the container runtime
    # and image prepared, or this job queues. Same fork guard as `test`: the
    # fleet never runs a fork's scripts — and `test` runs docs lint again on
    # macOS, so lint coverage survives even if this pool is down.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, arm64, kinhin-container]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check toolchain
        # `git ls-files` drives docs lint, and jq is the other tool the docs
        # workflows pipe through; both are baked into the image. Fail with the
        # fix instead of "command not found" halfway through the job.
        run: |
          git --version || { echo "::error::git is missing in the container image — re-bake: kinhin image prepare --container"; exit 1; }
          jq --version || { echo "::error::jq is missing in the container image — re-bake: kinhin image prepare --container"; exit 1; }

      - name: Docs lint (stale strings)
        run: bash scripts/docs-lint.sh

      - name: Docs sync (code-derived blocks)
        run: bash scripts/docs-sync.sh --check
