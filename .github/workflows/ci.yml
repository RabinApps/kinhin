name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly: also runs the ThreadSanitizer job
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Decides how much Swift work a pull request needs (scripts/ci-changes.sh): none for docs/website/skills/video/design
    # only, one test target for CLI-only or app-only changes, everything otherwise. Pushes, the nightly run and manual
    # dispatches always run everything. Plain bash and git on a pooled Blacksmith runner, so it is safe for fork PRs too.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      swift: ${{ steps.select.outputs.swift }}
      filter: ${{ steps.select.outputs.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Swift work
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            bash scripts/ci-changes.sh "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'swift=true\nfilter=\n' | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    # The self-hosted runner shares a Mac with the fleet and its Keychain, so
    # it never runs code from fork PRs (they would execute arbitrary tests).
    # Skipped when a PR touches nothing Swift can see (see `changes`).
    if: needs.changes.outputs.swift == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: kinhin-xcode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check toolchain
        # `swift test` needs XCTest, which ships with full Xcode (not the
        # Command Line Tools). Fail here with a pointer instead of minutes
        # into the build; see CONTRIBUTING.md "Requirements".
        run: |
          echo "xcode-select: $(xcode-select -p 2>&1)"
          swift --version
          if ! find "$(xcode-select -p)" -maxdepth 6 -name 'XCTest.framework' 2>/dev/null | grep -q .; then
            echo "::error::XCTest not found under $(xcode-select -p). Use a runner image with full Xcode (for example ghcr.io/cirruslabs/macos-tahoe-xcode:latest), not a Command Line Tools-only image."
            exit 1
          fi

      - name: Swift version
        run: swift --version

      - name: Lint (swift-format)
        run: swift format lint --strict -r Sources Tests

      - name: Run tests
        # A clean run takes about ten minutes; a hung test fails here instead
        # of holding the fleet's VM until GitHub's six-hour limit.
        timeout-minutes: 30
        # `swift package clean` makes every file recompile so the log carries all of this repo's warnings (an
        # incremental build only re-prints warnings for recompiled files); the scan then fails on any warning in
        # Sources/ or Tests/. pipefail keeps a failing `swift test` failing through the tee.
        # TEST_FILTER is empty for the full suite; on a CLI-only or app-only PR it names those test targets.
        env:
          TEST_FILTER: ${{ needs.changes.outputs.filter }}
        run: |
          set -o pipefail
          swift package clean
          swift test --build-system swiftbuild --parallel ${TEST_FILTER:+--filter "$TEST_FILTER"} 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          bash scripts/warnings-check.sh --scan "$RUNNER_TEMP/swift-test.log"

      - name: Build release products
        # Release-only code paths (KinhinTestSupport is testable-only) and the
        # signed-app pipeline both compile from these; catch breakage here
        # instead of at release time.
        run: swift build --build-system swiftbuild -c release --product kinhin-app --product kinhin

  tsan:
    # ThreadSanitizer pass over shared state: serial (~5–10 min), so it runs
    # on demand and nightly rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: kinhin-xcode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check toolchain
        # `swift test` needs XCTest, which ships with full Xcode (not the
        # Command Line Tools). Fail here with a pointer instead of minutes
        # into the build; see CONTRIBUTING.md "Requirements".
        run: |
          echo "xcode-select: $(xcode-select -p 2>&1)"
          swift --version
          if ! find "$(xcode-select -p)" -maxdepth 6 -name 'XCTest.framework' 2>/dev/null | grep -q .; then
            echo "::error::XCTest not found under $(xcode-select -p). Use a runner image with full Xcode (for example ghcr.io/cirruslabs/macos-tahoe-xcode:latest), not a Command Line Tools-only image."
            exit 1
          fi

      - name: Tests under ThreadSanitizer (serial)
        # The script exits nonzero on any sanitizer report; a failing exit
        # with "No ThreadSanitizer reports" means a test regression.
        run: scripts/tsan.sh

  fork:
    needs: changes
    # Fork PRs never reach the self-hosted fleet (the `test` job skips them), so
    # they get the same lint, tests and release build on a GitHub-hosted Mac:
    # contributors see results, and their code never runs on our hardware. No
    # secrets, read-only token, and the checkout keeps no credentials.
    if: needs.changes.outputs.swift == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check toolchain
        # The package needs Swift 6.2 (Xcode 26+); pick the newest Xcode the
        # image has rather than trusting its default.
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          echo "xcode-select: $(xcode-select -p)"
          swift --version

      - name: Lint (swift-format)
        run: swift format lint --strict -r Sources Tests

      - name: Run tests
        timeout-minutes: 30
        # `swift package clean` makes every file recompile so the log carries all of this repo's warnings (an
        # incremental build only re-prints warnings for recompiled files); the scan then fails on any warning in
        # Sources/ or Tests/. pipefail keeps a failing `swift test` failing through the tee.
        # TEST_FILTER is empty for the full suite; on a CLI-only or app-only PR it names those test targets.
        env:
          TEST_FILTER: ${{ needs.changes.outputs.filter }}
        run: |
          set -o pipefail
          swift package clean
          swift test --build-system swiftbuild --parallel ${TEST_FILTER:+--filter "$TEST_FILTER"} 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          bash scripts/warnings-check.sh --scan "$RUNNER_TEMP/swift-test.log"

      - name: Build release products
        run: swift build --build-system swiftbuild -c release --product kinhin-app --product kinhin

  docs:
    # Docs lint, docs-sync --check and skills lint are grep/sed/awk scripts with
    # no Swift or macOS dependency, so they run on a pooled Blacksmith runner, never
    # on the self-hosted fleet. That makes it safe to run for fork PRs too (no
    # fork guard): the job has read-only contents permission, no secrets, and
    # shares no Keychain or Mac with the fleet. Keep this step list in sync with
    # scripts/check.sh.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Changelog structure
        run: bash scripts/changelog.sh check

      - name: Docs lint (stale strings)
        run: bash scripts/docs-lint.sh

      - name: Docs sync (code-derived blocks)
        run: bash scripts/docs-sync.sh --check

      - name: Skills lint (frontmatter + command drift)
        run: bash scripts/skills-lint.sh

      - name: Rules lint (try!, as!, force unwraps, locks, try?, file length)
        run: bash scripts/rules-lint.sh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # video-check.sh installs video/ when node_modules is absent; keep both on the runner's npm cache.
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Video suite (claims, ci.json, unit tests)
        run: bash scripts/video-check.sh

      - name: Script tests (CI change selection)
        run: bash scripts/ci-changes-test.sh

      - name: Script tests (e2e spec selection)
        run: bash scripts/e2e-select-test.sh

  gate:
    # The one job to mark required in branch protection. The jobs above can be skipped (no Swift changes, fork vs.
    # self-hosted), and a skipped job reports success, so this fails only when something failed or was cancelled,
    # including `changes` itself, or when needed Swift work did not run. `if: always()` makes it run (and report) even when a dependency failed.
    if: always()
    needs: [changes, test, fork, docs]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Require every job that ran to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SWIFT: ${{ needs.changes.outputs.swift }}
          TEST: ${{ needs.test.result }}
          FORK: ${{ needs.fork.result }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
          # A skipped job passes above, so also require that Swift work the `changes` job asked for actually ran:
          # `test` (self-hosted) or `fork` (fork PRs) must have succeeded. This catches an `if:` edit that skips both.
          if [ "$SWIFT" = "true" ] && [ "$TEST" != "success" ] && [ "$FORK" != "success" ]; then
            echo "::error::changes selected Swift work but neither test nor fork succeeded (test=$TEST fork=$FORK)"
            exit 1
          fi
