name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 6 * * *" # nightly: also runs the ThreadSanitizer job
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # The self-hosted runner shares a Mac with the fleet and its Keychain, so
    # it never runs code from fork PRs (they would execute arbitrary tests).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: kinhin-xcode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check toolchain
        # `swift test` needs XCTest, which ships with full Xcode (not the
        # Command Line Tools). Fail here with a pointer instead of minutes
        # into the build; see CONTRIBUTING.md "Requirements".
        run: |
          echo "xcode-select: $(xcode-select -p 2>&1)"
          swift --version
          if ! find "$(xcode-select -p)" -maxdepth 6 -name 'XCTest.framework' 2>/dev/null | grep -q .; then
            echo "::error::XCTest not found under $(xcode-select -p). Use a runner image with full Xcode (for example ghcr.io/cirruslabs/macos-tahoe-xcode:latest), not a Command Line Tools-only image."
            exit 1
          fi

      - name: Swift version
        run: swift --version

      - name: Lint (swift-format)
        run: swift format lint --strict -r Sources Tests

      - name: Run tests
        # A clean run takes about ten minutes; a hung test fails here instead
        # of holding the fleet's VM until GitHub's six-hour limit.
        timeout-minutes: 30
        run: swift test --parallel

      - name: Build release products
        # Release-only code paths (KinhinTestSupport is testable-only) and the
        # signed-app pipeline both compile from these; catch breakage here
        # instead of at release time.
        run: swift build -c release --product kinhin-app --product kinhin

  tsan:
    # ThreadSanitizer pass over shared state: serial (~5–10 min), so it runs
    # on demand and nightly rather than on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: kinhin-xcode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check toolchain
        # `swift test` needs XCTest, which ships with full Xcode (not the
        # Command Line Tools). Fail here with a pointer instead of minutes
        # into the build; see CONTRIBUTING.md "Requirements".
        run: |
          echo "xcode-select: $(xcode-select -p 2>&1)"
          swift --version
          if ! find "$(xcode-select -p)" -maxdepth 6 -name 'XCTest.framework' 2>/dev/null | grep -q .; then
            echo "::error::XCTest not found under $(xcode-select -p). Use a runner image with full Xcode (for example ghcr.io/cirruslabs/macos-tahoe-xcode:latest), not a Command Line Tools-only image."
            exit 1
          fi

      - name: Tests under ThreadSanitizer (serial)
        # The script exits nonzero on any sanitizer report; a failing exit
        # with "No ThreadSanitizer reports" means a test regression.
        run: scripts/tsan.sh

  fork:
    # Fork PRs never reach the self-hosted fleet (the `test` job skips them), so
    # they get the same lint, tests and release build on a GitHub-hosted Mac:
    # contributors see results, and their code never runs on our hardware. No
    # secrets, read-only token, and the checkout keeps no credentials.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check toolchain
        # The package needs Swift 6.2 (Xcode 26+); pick the newest Xcode the
        # image has rather than trusting its default.
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          echo "xcode-select: $(xcode-select -p)"
          swift --version

      - name: Lint (swift-format)
        run: swift format lint --strict -r Sources Tests

      - name: Run tests
        timeout-minutes: 30
        run: swift test --parallel

      - name: Build release products
        run: swift build -c release --product kinhin-app --product kinhin

  docs:
    # Docs lint, docs-sync --check and skills lint are grep/sed/awk scripts with
    # no Swift or macOS dependency, so they run on a GitHub-hosted runner, never
    # on the self-hosted fleet. That makes it safe to run for fork PRs too (no
    # fork guard): the job has read-only contents permission, no secrets, and
    # shares no Keychain or Mac with the fleet. Keep this step list in sync with
    # scripts/check.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Changelog structure
        run: bash scripts/changelog.sh check

      - name: Docs lint (stale strings)
        run: bash scripts/docs-lint.sh

      - name: Docs sync (code-derived blocks)
        run: bash scripts/docs-sync.sh --check

      - name: Skills lint (frontmatter + command drift)
        run: bash scripts/skills-lint.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Video suite (claims, ci.json, unit tests)
        run: bash scripts/video-check.sh
