# Prometheus alert rules for kinhin telemetry. Names are the ones OTLP ingestion produces (Mimir, Grafana Cloud, a
# Prometheus with the OTLP receiver): counters end in `_total`. Scraping kinhin's own /metrics endpoint
# (`prometheus_listen`) exposes counters without `_total`; drop the suffix in the expressions below for that setup.
#
# KinhinExportFailing reads a counter that travels through the same exporter that is failing: when the collector is
# unreachable the metrics push fails too, so the series may never arrive. It reliably covers a failing traces or logs
# endpoint while metrics still arrive, and a setup that scrapes /metrics. KinhinTelemetrySilent covers the rest: it
# fires when a series kinhin always publishes stops arriving. Load it only for instances that have telemetry enabled
# with the metrics signal: with telemetry off, or `signals` without `metrics`, kinhin_fleet_active is absent by design.
groups:
  - name: kinhin
    rules:
      - alert: KinhinQueueStuck
        expr: max(kinhin_queue_age) > 600
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: A queued job has waited more than 10 minutes
          description: Check capacity (kinhin_pool_capacity), spawn problems and `kinhin status`.
      - alert: KinhinFleetBelowDesired
        expr: kinhin_fleet_desired - kinhin_fleet_active > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: The fleet has not reached its desired size for 15 minutes
      - alert: KinhinErrors
        expr: sum by (error_type) (increase(cicd_system_errors_total[15m])) > 3
        labels: {severity: warning}
        annotations:
          summary: "kinhin is failing with {{ $labels.error_type }}"
      - alert: KinhinForgeRateLimitLow
        expr: min by (kinhin_forge) (kinhin_forge_rate_limit_remaining) < 200
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "The {{ $labels.kinhin_forge }} API budget is nearly spent"
      - alert: KinhinDiskLow
        expr: kinhin_host_disk_free < 20 * 1024 * 1024 * 1024
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: Less than 20 GB free on the kinhin host
      - alert: KinhinExportFailing
        expr: increase(kinhin_telemetry_export_failures_total[15m]) > 0
        labels: {severity: info}
        annotations:
          summary: kinhin cannot deliver telemetry; run `kinhin telemetry status`
      - alert: KinhinTelemetrySilent
        expr: absent(kinhin_fleet_active)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: No kinhin metrics have arrived for 10 minutes (daemon down or telemetry not delivering); run `kinhin telemetry status`
          description: Only meaningful where telemetry is enabled with the metrics signal.
      - alert: KinhinPaused
        expr: kinhin_fleet_paused == 1
        for: 1h
        labels: {severity: info}
        annotations:
          summary: The fleet has been paused for an hour
      - alert: KinhinReconcileStale
        expr: time() - kinhin_reconcile_last_success > 300
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: The kinhin control loop has not completed a pass for five minutes
      - alert: KinhinSpawnHeld
        expr: max by (kinhin_pool, kinhin_spawn_hold_reason) (kinhin_spawn_held) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "New runners are held back ({{ $labels.kinhin_spawn_hold_reason }})"
